<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandsTrack - Trust Report | Company Risk Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f9fafb;
            color: #1f2937;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* ===== HEADER ===== */
        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        .logo span:first-child { color: #1f3a93; }
        .logo span:last-child { color: #3b82f6; }

        nav { display: flex; gap: 40px; list-style: none; }
        nav a { text-decoration: none; color: #6b7280; font-weight: 500; }
        nav a:hover { color: #3b82f6; }

        .header-action a {
            background: #3b82f6;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .header-action a:hover { background: #2563eb; }

        /* ===== MAIN CONTENT ===== */
        .hero-small {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .hero-small h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
        .hero-small p { font-size: 16px; opacity: 0.95; }

        /* ===== SEARCH BOX ===== */
        .search-container {
            background: white;
            padding: 40px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-heading { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 20px; }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .search-box input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .search-box button {
            padding: 14px 32px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-box button:hover { background: #2563eb; }

        /* ===== ALERT MESSAGES ===== */
        .alert { margin: 20px 0; padding: 16px; border-radius: 8px; }
        .alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }
        .alert-success { background: #dcfce7; color: #166534; border-left: 4px solid #16a34a; }

        /* ===== REPORT SECTION ===== */
        .report-section {
            display: none;
            padding: 40px 0;
        }

        .report-section.show { display: block; }

        .report-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .report-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .company-name { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .company-cac { font-size: 14px; opacity: 0.9; }

        .report-body { padding: 30px; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        .info-label { font-size: 12px; color: #6b7280; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .info-value { font-size: 16px; font-weight: 700; color: #1f2937; }

        /* ===== RISK BADGE ===== */
        .risk-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .risk-low { background: #dcfce7; color: #166534; }
        .risk-medium { background: #fef3c7; color: #92400e; }
        .risk-high { background: #fee2e2; color: #991b1b; }

        /* ===== SCORE ===== */
        .score-section {
            text-align: center;
            padding: 30px;
            background: #f9fafb;
            border-radius: 8px;
            margin: 30px 0;
        }

        .score-label { font-size: 12px; color: #6b7280; text-transform: uppercase; margin-bottom: 10px; }
        .score-number { font-size: 48px; font-weight: 800; color: #3b82f6; }
        .score-message { color: #6b7280; margin-top: 10px; }

        /* ===== PAYMENT ===== */
        .payment-section {
            background: #eff6ff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin: 30px 0;
        }

        .payment-heading { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
        .payment-price { font-size: 24px; color: #3b82f6; font-weight: 800; margin-bottom: 20px; }
        .payment-btn {
            background: #3b82f6;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }

        .payment-btn:hover { background: #2563eb; }

        /* ===== LOADING ===== */
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 3px solid #e5e7eb; border-top: 3px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== FOOTER ===== */
        footer {
            background: #1f2937;
            color: white;
            padding: 40px 0;
            text-align: center;
            margin-top: 60px;
        }

        footer p { margin: 10px 0; opacity: 0.8; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header { padding: 15px 0; }
            .header-content { flex-direction: column; gap: 15px; }
            nav { display: none; }
            .hero-small { padding: 40px 20px; }
            .hero-small h1 { font-size: 24px; }
            .search-box { flex-direction: column; }
            .search-box button { width: 100%; }
            .report-header { padding: 20px; }
            .company-name { font-size: 20px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo"><span>Brands</span><span>Track</span></a>
                <nav>
                    <a href="/">Home</a>
                    <a href="/#pricing">Pricing</a>
                </nav>
                <div class="header-action">
                    <a href="/">Back to Home</a>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero-small">
        <div class="container">
            <h1>Company Trust Report</h1>
            <p>Get instant verification, risk analysis, and business intelligence</p>
        </div>
    </section>

    <!-- SEARCH -->
    <section class="search-container">
        <div class="container">
            <h2 class="search-heading">Search Company</h2>
            <div class="search-box">
                <input type="text" id="searchQuery" placeholder="Company name or CAC number..." onkeypress="if(event.key==='Enter') searchCompany()">
                <button onclick="searchCompany()">Search</button>
            </div>
            <div id="messages"></div>
        </div>
    </section>

    <!-- REPORT -->
    <section class="report-section" id="reportSection">
        <div class="container">
            <div class="report-card">
                <div class="report-header">
                    <div class="company-name" id="companyTitle">Company Name</div>
                    <div class="company-cac" id="companyCac">CAC: N/A</div>
                </div>
                <div class="report-body">
                    <div id="riskBadge" class="risk-badge">Analyzing...</div>

                    <div class="info-grid" id="infoGrid"></div>

                    <div class="score-section">
                        <div class="score-label">Trust Score</div>
                        <div class="score-number" id="scoreNumber">--</div>
                        <div class="score-message" id="scoreMessage">Loading...</div>
                    </div>

                    <div class="payment-section">
                        <div class="payment-heading">Get Full Report</div>
                        <div class="payment-price">₦3,500</div>
                        <button class="payment-btn" onclick="initiatePayment()">Pay & Get Report</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2026 BrandsTrack. Verifying Nigerian Businesses.</p>
            <p><a href="/">Home</a> • <a href="mailto:support@brandstrack.com">Support</a></p>
        </div>
    </footer>

    <script>
        const API_BASE = 'https://brandsintel-backend.onrender.com';

        function showMessage(text, type = 'error') {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
        }

        function searchCompany() {
            const query = document.getElementById('searchQuery').value.trim();
            const msgDiv = document.getElementById('messages');
            const reportSection = document.getElementById('reportSection');

            msgDiv.innerHTML = '';
            reportSection.classList.remove('show');

            if (!query) {
                showMessage('Enter company name or CAC number');
                return;
            }

            msgDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching...</p></div>';

            // Try multiple endpoints
            const endpoints = [
                `${API_BASE}/api/v1/companies/search?q=${encodeURIComponent(query)}`,
                `${API_BASE}/api/companies/search?q=${encodeURIComponent(query)}`,
                `${API_BASE}/api/search?q=${encodeURIComponent(query)}`
            ];

            let attempts = 0;

            function tryEndpoint() {
                if (attempts >= endpoints.length) {
                    showMessage('Search service unavailable. Please try again later.');
                    return;
                }

                fetch(endpoints[attempts], { headers: { 'Content-Type': 'application/json' } })
                    .then(r => r.json())
                    .then(data => {
                        const results = data.results || data.data || [];
                        if (results.length > 0) {
                            displayReport(results[0]);
                            msgDiv.innerHTML = '';
                        } else {
                            showMessage('No company found. Try another search.');
                        }
                    })
                    .catch(() => {
                        attempts++;
                        tryEndpoint();
                    });
            }

            tryEndpoint();
        }

        function displayReport(company) {
            const score = company.trust_score || 75;
            const name = company.name || 'Unknown Company';
            const cac = company.cac_number || 'N/A';
            const industry = company.industry || 'Not specified';
            const status = company.status || 'Active';

            // Determine risk level
            let riskLevel = 'high';
            let riskText = 'High Risk';
            let riskClass = 'risk-high';

            if (score >= 70) {
                riskLevel = 'low';
                riskText = '✓ Low Risk';
                riskClass = 'risk-low';
            } else if (score >= 40) {
                riskLevel = 'medium';
                riskText = '⚠ Medium Risk';
                riskClass = 'risk-medium';
            }

            document.getElementById('companyTitle').textContent = name;
            document.getElementById('companyCac').textContent = `CAC: ${cac}`;
            document.getElementById('riskBadge').innerHTML = `<span class="risk-badge ${riskClass}">${riskText}</span>`;
            document.getElementById('scoreNumber').textContent = score;
            document.getElementById('scoreMessage').textContent = 
                score >= 70 ? '✓ This company is verified and low-risk' :
                score >= 40 ? '⚠ Proceed with caution' :
                '✗ High-risk business. Verify before proceeding';

            document.getElementById('infoGrid').innerHTML = `
                <div class="info-box">
                    <div class="info-label">Industry</div>
                    <div class="info-value">${industry}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Status</div>
                    <div class="info-value">${status}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Verification</div>
                    <div class="info-value">${score >= 70 ? '✓ Verified' : 'Unverified'}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Region</div>
                    <div class="info-value">${company.region || 'Nigeria'}</div>
                </div>
            `;

            // Store current company for payment
            window.currentCompany = { name, cac, score };

            document.getElementById('reportSection').classList.add('show');
        }

        function initiatePayment() {
            const email = prompt('Enter your email for payment:');
            if (!email) return;

            if (!email.includes('@')) {
                alert('Please enter a valid email');
                return;
            }

            // Create payment reference
            const reference = `BT-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            const amount = 350000; // 3,500 in kobo for Paystack

            // Redirect to Paystack
            const paystackUrl = `https://checkout.paystack.com/pay/${window.PAYSTACK_PUBLIC_KEY || 'pk_live_f50aba470014c265bac4a6e2697149136638c76f'}?email=${encodeURIComponent(email)}&amount=${amount}&reference=${reference}`;
            
            window.location.href = paystackUrl;
        }

        // Auto-load from URL params
        window.addEventListener('load', () => {
            const params = new URLSearchParams(location.search);
            const query = params.get('q');
            if (query) {
                document.getElementById('searchQuery').value = query;
                searchCompany();
            }
        });
    </script>
</body>
</html>
