<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BrandsTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-content p {
            font-size: 14px;
            opacity: 0.9;
        }

        .logout-btn {
            padding: 12px 24px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .content {
            padding: 40px 30px;
        }

        .alerts {
            margin-bottom: 30px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .section-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        .tiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .tier-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .tier-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
        }

        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .tier-name {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .tier-key {
            font-size: 12px;
            color: white;
            background: #667eea;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .tier-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-value {
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 600;
        }

        .features-list {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .features-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .features {
            list-style: none;
        }

        .features li {
            padding: 6px 0;
            color: #666;
            font-size: 13px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #ffebee;
            color: #c62828;
        }

        .btn-delete:hover {
            background: #ffcdd2;
            transform: translateY(-2px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 14px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-submit {
            flex: 1;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-cancel {
            flex: 1;
            padding: 14px 24px;
            background: #f0f0f0;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .content {
                padding: 20px;
            }

            .tiers-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>⚙️ Pricing Control Panel</h1>
                <p>Manage all pricing tiers, features, and monthly check limits</p>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="content">
            <div class="alerts">
                <div class="alert alert-success" id="successMessage"></div>
                <div class="alert alert-error" id="errorMessage"></div>
            </div>

            <h2 class="section-title">Pricing Tiers</h2>
            <div class="tiers-grid" id="tiersContainer">
                <div class="loading">Loading pricing tiers...</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Edit Tier</span>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form onsubmit="saveEditedTier(event)">
                <div class="form-group">
                    <label class="form-label">Tier Name</label>
                    <input type="text" class="form-input" id="editTierName" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Monthly Price (₦)</label>
                    <input type="number" class="form-input" id="editMonthlyPrice">
                </div>

                <div class="form-group">
                    <label class="form-label">Monthly Checks</label>
                    <input type="number" class="form-input" id="editMonthlyChecks" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Features (one per line)</label>
                    <textarea class="form-textarea" id="editTierFeatures"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn-submit">Save Changes</button>
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'https://brandsintel-backend.onrender.com';
        let currentEditingTierKey = null;
        let allTiers = [];

        // Check auth and load on page load
        window.addEventListener('load', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }
            loadPricingTiers(token);
        });

        async function loadPricingTiers(token) {
            try {
                const response = await fetch(`${API_BASE}/api/v1/pricing/tiers`);
                if (!response.ok) throw new Error('Failed to fetch tiers');
                
                const data = await response.json();
                allTiers = data.tiers || [];
                renderTiers(token);
            } catch (error) {
                console.error('Error loading tiers:', error);
                showError(`❌ Failed to load pricing tiers: ${error.message}`);
            }
        }

        function renderTiers(token) {
            const container = document.getElementById('tiersContainer');
            container.innerHTML = '';

            if (!allTiers || allTiers.length === 0) {
                container.innerHTML = '<div class="loading">No pricing tiers found</div>';
                return;
            }

            allTiers.forEach(tier => {
                const tierCard = document.createElement('div');
                tierCard.className = 'tier-card';

                const priceDisplay = tier.monthly_price_naira 
                    ? `₦${tier.monthly_price_naira.toLocaleString()}` 
                    : 'Custom';
                const checksDisplay = tier.monthly_checks === 9999 ? 'Unlimited' : tier.monthly_checks;
                const features = Array.isArray(tier.features) ? tier.features : [];

                tierCard.innerHTML = `
                    <div class="tier-header">
                        <div>
                            <div class="tier-name">${tier.tier_name}</div>
                            <div class="status-badge">✅ Active</div>
                        </div>
                        <div class="tier-key">${tier.tier_key}</div>
                    </div>

                    <div class="tier-info">
                        <div class="info-row">
                            <span class="info-label">Monthly Price</span>
                            <span class="info-value">${priceDisplay}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Monthly Checks</span>
                            <span class="info-value">${checksDisplay}</span>
                        </div>
                    </div>

                    <div class="features-list">
                        <div class="features-label">Features</div>
                        <ul class="features">
                            ${features.map(f => `<li>✓ ${f}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-edit" onclick="openEditModal('${tier.tier_key}')">✏️ Edit</button>
                        <button class="btn btn-delete" onclick="deleteTier('${tier.tier_key}', '${localStorage.getItem('authToken')}')">🗑️ Delete</button>
                    </div>
                `;

                container.appendChild(tierCard);
            });
        }

        function openEditModal(tierKey) {
            currentEditingTierKey = tierKey;
            const tier = allTiers.find(t => t.tier_key === tierKey);

            if (!tier) {
                showError('❌ Tier not found');
                return;
            }

            document.getElementById('editTierName').value = tier.tier_name || '';
            document.getElementById('editMonthlyPrice').value = tier.monthly_price_naira || '';
            document.getElementById('editMonthlyChecks').value = tier.monthly_checks === 9999 ? '' : tier.monthly_checks;
            document.getElementById('editTierFeatures').value = (tier.features || []).join('\n');

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            currentEditingTierKey = null;
        }

        async function saveEditedTier(event) {
            event.preventDefault();

            const token = localStorage.getItem('authToken');
            if (!token) {
                showError('❌ Authentication lost. Please login again.');
                return;
            }

            const tierName = document.getElementById('editTierName').value.trim();
            const monthlyPrice = document.getElementById('editMonthlyPrice').value ? parseInt(document.getElementById('editMonthlyPrice').value) : null;
            const monthlyChecks = document.getElementById('editMonthlyChecks').value ? parseInt(document.getElementById('editMonthlyChecks').value) : 0;
            const featuresText = document.getElementById('editTierFeatures').value;
            const features = featuresText.split('\n').map(f => f.trim()).filter(f => f.length > 0);

            if (!tierName) {
                showError('❌ Tier name is required');
                return;
            }

            if (monthlyChecks === 0) {
                showError('❌ Monthly checks must be greater than 0');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/pricing/tiers/${currentEditingTierKey}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        tier_name: tierName,
                        monthly_price_naira: monthlyPrice,
                        monthly_checks: monthlyChecks,
                        features: features
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Failed to update tier`);
                }

                closeEditModal();
                showSuccess(`✅ ${tierName} tier updated successfully!`);
                loadPricingTiers(token);
            } catch (error) {
                console.error('Error saving tier:', error);
                showError(`❌ ${error.message}`);
            }
        }

        async function deleteTier(tierKey, token) {
            if (!confirm(`Are you sure? This will deactivate the "${tierKey}" tier.`)) {
                return;
            }

            if (!token) {
                showError('❌ Authentication lost. Please login again.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/pricing/tiers/${tierKey}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}` 
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to delete tier');
                }

                showSuccess(`✅ Pricing tier "${tierKey}" deleted!`);
                loadPricingTiers(token);
            } catch (error) {
                console.error('Error:', error);
                showError(`❌ ${error.message}`);
            }
        }

        function showSuccess(message) {
            const msg = document.getElementById('successMessage');
            msg.textContent = message;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 4000);
        }

        function showError(message) {
            const msg = document.getElementById('errorMessage');
            msg.textContent = message;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 4000);
        }

        function handleLogout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
